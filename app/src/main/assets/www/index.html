<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="ServicePilot helps solo service businesses track clients, jobs, invoices, expenses and payments.">
  <title>ServicePilot — Service Business Manager</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">S</div><div><strong>ServicePilot</strong><small>Business workspace</small></div></div>
      <nav id="nav">
        <button class="nav-item active" data-view="dashboard"><span>▦</span> Overview</button>
        <button class="nav-item" data-view="clients"><span>♙</span> Clients</button>
        <button class="nav-item" data-view="sales"><span>↗</span> Sales records</button>
        <button class="nav-item" data-view="jobs"><span>▤</span> Jobs & projects</button>
        <button class="nav-item" data-view="invoices"><span>▧</span> Sales invoices</button>
        <button class="nav-item" data-view="purchases"><span>🧾</span> Purchase bills</button>
        <button class="nav-item" data-view="tenders"><span>⌕</span> Tender desk</button>
        <button class="nav-item" data-view="expenses"><span>↘</span> Expenses</button>
        <button class="nav-item" data-view="products"><span>▣</span> Products & inventory</button>
        <button class="nav-item" data-view="tasks"><span>✓</span> Tasks & KPI</button>
        <button class="nav-item" data-view="services"><span>◇</span> Service templates</button>
        <button class="nav-item" data-view="calculator"><span>₹</span> Profit calculator</button>
        <button class="nav-item" data-view="reports"><span>◷</span> Reports</button>
        <button class="nav-item" data-view="settings"><span>⚙</span> Settings & backup</button>
      </nav>
      <div class="sidebar-foot"><span class="status-dot"></span><span id="storage-status">Saved on this device</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="menu-btn" aria-label="Open menu">☰</button>
        <div class="crumb"><span>Workspace</span><b>/</b><strong id="page-title">Overview</strong></div>
        <div class="top-actions">
          <span class="offline-pill" id="network-state">● Local mode</span>
          <button class="btn btn-primary" id="quick-add">＋ Add new</button>
        </div>
      </header>
      <section class="content" id="view-root"></section>
      <footer class="footer">ServicePilot Business Command Center · Offline-first business manager</footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
  <script src="app.js"></script>
</body>
</html>
